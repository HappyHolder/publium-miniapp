name: publium

# Run from this directory: `docker compose up -d --build`
# Reads variables from deploy/.env (copy deploy/.env.example -> deploy/.env).

services:
  # ── PostgreSQL (self-hosted, replaces Neon) ──────────────────────────────────
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    pids_limit: 256
    mem_limit: 2g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Backend API (Express + Prisma + Playwright) ──────────────────────────────
  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Internal Postgres — pooled and direct are the same host inside the network.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL:   postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: "8787"
      NODE_ENV: production
      # Local filesystem storage (replaces Vercel Blob).
      STORAGE_DIR: /data/uploads
      PUBLIC_BASE_URL: https://${DOMAIN}
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      MODERATOR_BOT_TOKEN: ${MODERATOR_BOT_TOKEN}
      MODERATOR_WEBHOOK_SECRET: ${MODERATOR_WEBHOOK_SECRET}
      MODERATOR_BOT_USERNAME: ${MODERATOR_BOT_USERNAME:-publium_moder_bot}
      COMMUNITY_MANAGER_BOT_TOKEN: ${COMMUNITY_MANAGER_BOT_TOKEN:-}
      COMMUNITY_MANAGER_WEBHOOK_SECRET: ${COMMUNITY_MANAGER_WEBHOOK_SECRET:-}
      COMMUNITY_MANAGER_BOT_USERNAME: ${COMMUNITY_MANAGER_BOT_USERNAME:-publium_community_bot}
      MANAGED_BOT_ENCRYPTION_KEY: ${MANAGED_BOT_ENCRYPTION_KEY:-}
      # gramJS userbot (community manager) — was a server-local edit; committed here.
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-0}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      WEBHOOK_URL: https://${DOMAIN}/api/bot/webhook
      MINI_APP_URL: https://${DOMAIN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS}
      # AI text
      # Direct OpenAI — REQUIRED. Every text, vision, transcription and cover path
      # runs on this key with no second provider. ASSISTANT_PROVIDER is gone: the
      # assistant takes the native tool-calling path whenever the key is present.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-terra}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL:-gpt-4o-mini-transcribe}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      # AI images. IMAGE_PROVIDER=none switches cover generation off; any other
      # value (historically 'replicate') leaves it on. IMAGE_MODEL is gone.
      IMAGE_PROVIDER: ${IMAGE_PROVIDER}
      COVER_ENGINE: ${COVER_ENGINE}
      # Replicate is now used by exactly one feature: panoramas / the 4x4 grid
      # (nano-banana — the only model that renders 1:4, 4:1, 1:8 and 8:1).
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN}
      # Web search (optional). Serper = real Google results (preferred); Tavily = fallback.
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      # TON payments
      TON_RECEIVING_WALLET: ${TON_RECEIVING_WALLET}
      TONCENTER_API_KEY: ${TONCENTER_API_KEY}
    volumes:
      - uploads:/data/uploads
    init: true
    pids_limit: 256
    mem_limit: 3g
    cpus: "2.0"
    security_opt:
      - no-new-privileges:true

  # ── Edge: Caddy (SPA + reverse proxy + static files + auto HTTPS) ─────────────
  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - uploads:/srv/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    pids_limit: 128
    mem_limit: 512m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
