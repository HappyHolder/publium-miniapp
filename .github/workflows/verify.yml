name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: publium_audit_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://audit:audit@localhost:5432/publium_audit_ci
      DIRECT_URL: postgresql://audit:audit@localhost:5432/publium_audit_ci
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_WEBHOOK_SECRET: test-secret
      PUBLIC_BASE_URL: https://example.com
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run build --prefix server
      - run: npm test --prefix server
      - run: node server/scripts/security-smoke.mjs
      - run: cd server && npx prisma migrate deploy && node scripts/audit-integration.mjs
      - run: npm run test:frontend
